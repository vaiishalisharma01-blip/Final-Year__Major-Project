<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CropSense AI — Crop Recommendation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/crop-recom.css') }}" />
</head>
<body>

<div class="page-wrap">

  <!-- LEFT: inputs -->
  <div class="panel panel-left">
    <a href="/" id="home-btn" title="Back to Home">
      <img src="{{ url_for('static', filename='assets/home-icon.png') }}" alt="Home" />
    </a>
    <div class="panel-header">
      <span class="panel-icon">🌱</span>
      <div>
        <h1>Crop Recommendation</h1>
        <p class="panel-sub">Fill in your soil data — results update instantly</p>
      </div>
    </div>

    <div class="fields-grid">
      <div class="field-group">
        <label for="nitrogen">Nitrogen <span class="unit">(N · kg/ha)</span></label>
        <input type="number" id="nitrogen" placeholder="e.g. 90" min="0" max="200" />
      </div>
      <div class="field-group">
        <label for="phosphorus">Phosphorus <span class="unit">(P · kg/ha)</span></label>
        <input type="number" id="phosphorus" placeholder="e.g. 42" min="0" max="200" />
      </div>
      <div class="field-group">
        <label for="potassium">Potassium <span class="unit">(K · kg/ha)</span></label>
        <input type="number" id="potassium" placeholder="e.g. 43" min="0" max="200" />
      </div>
      <div class="field-group">
        <label for="ph">Soil pH <span class="unit">(0–14)</span></label>
        <input type="number" id="ph" placeholder="e.g. 6.5" step="0.1" min="0" max="14" />
      </div>
      <div class="field-group">
        <label for="rainfall">Rainfall <span class="unit">(mm)</span></label>
        <input type="number" id="rainfall" placeholder="e.g. 200" min="0" />
      </div>
      <div class="field-group">
        <label for="city">Nearest City</label>
        <select id="city">
          <option value="">Select city…</option>
          <option>Mumbai</option><option>Delhi</option><option>Bengaluru</option>
          <option>Hyderabad</option><option>Ahmedabad</option><option>Chennai</option>
          <option>Kolkata</option><option>Pune</option><option>Jaipur</option>
          <option>Lucknow</option><option>Kanpur</option><option>Nagpur</option>
          <option>Indore</option><option>Bhopal</option><option>Patna</option>
          <option>Ludhiana</option><option>Agra</option><option>Varanasi</option>
          <option>Nashik</option><option>Coimbatore</option>
        </select>
      </div>
    </div>

    <button id="predict-btn" onclick="predict()">🌾 Get Recommendation</button>
    <button id="reset-btn" onclick="resetForm()">↺ Reset</button>
  </div>

  <!-- RIGHT: result -->
  <div class="panel panel-right">
    <div id="result-idle" class="result-state">
      <div class="idle-icon">🌾</div>
      <p>Enter your soil details on the left<br>and your recommendation will appear here.</p>
    </div>

    <div id="result-loading" class="result-state" style="display:none">
      <div class="spinner"></div>
      <p>Analysing soil data…</p>
    </div>

    <div id="result-success" class="result-state" style="display:none">
      <div class="crop-badge" id="crop-emoji">🌿</div>
      <div class="result-label">Recommended Crop</div>
      <div class="crop-name" id="crop-name">—</div>
      <div class="result-note" id="crop-note"></div>
    </div>

    <div id="result-error" class="result-state" style="display:none">
      <div class="err-icon">⚠️</div>
      <p id="error-msg">Something went wrong.</p>
    </div>
  </div>

</div>

<script>
const CROP_EMOJIS = {
  rice:'🌾', maize:'🌽', chickpea:'🫘', kidneybeans:'🫘', pigeonpeas:'🫘',
  mothbeans:'🫘', mungbean:'🫘', blackgram:'🫘', lentil:'🫘',
  pomegranate:'🍎', banana:'🍌', mango:'🥭', grapes:'🍇', watermelon:'🍉',
  muskmelon:'🍈', apple:'🍎', orange:'🍊', papaya:'🍈', coconut:'🥥',
  cotton:'🌸', jute:'🌿', coffee:'☕'
};

function allFilled() {
  return ['nitrogen','phosphorus','potassium','ph','rainfall','city']
    .every(id => document.getElementById(id).value.trim() !== '');
}

function showState(name) {
  ['idle','loading','success','error'].forEach(s =>
    document.getElementById('result-' + s).style.display = s === name ? 'flex' : 'none'
  );
}

function predict() {
  if (!allFilled()) {
    showState('error');
    document.getElementById('error-msg').textContent = 'Please fill in all fields before predicting.';
    return;
  }
  showState('loading');

  const data = new URLSearchParams({
    nitrogen:   document.getElementById('nitrogen').value,
    phosphorus: document.getElementById('phosphorus').value,
    potassium:  document.getElementById('potassium').value,
    'ph-level': document.getElementById('ph').value,
    rainfall:   document.getElementById('rainfall').value,
    city:       document.getElementById('city').value,
  });

  fetch('/predict', { method: 'POST', body: data })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        showState('error');
        document.getElementById('error-msg').textContent = resp.error;
      } else {
        const crop = resp.prediction;
        const display = crop.charAt(0).toUpperCase() + crop.slice(1);
        document.getElementById('crop-emoji').textContent = CROP_EMOJIS[crop] || '🌿';
        document.getElementById('crop-name').textContent  = display;
        document.getElementById('crop-note').textContent  = 'Based on N/P/K, pH, rainfall & local weather data.';
        showState('success');
      }
    })
    .catch(() => {
      showState('error');
      document.getElementById('error-msg').textContent = 'Could not reach server. Is the app running?';
    });
}

function resetForm() {
  ['nitrogen','phosphorus','potassium','ph','rainfall','city']
    .forEach(id => { document.getElementById(id).value = ''; });
  showState('idle');
}
</script>
</body>
</html>
