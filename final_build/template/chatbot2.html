<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropSense AI ChatBot</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        background-color: #f0f7f0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .chat-container {
        max-width: 740px;
        margin: 40px auto;
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      }

      .chat-header {
        text-align: center;
        color: #2d6a4f;
        margin-bottom: 20px;
      }

      .api-key-section {
        background: #f8fff8;
        border: 1px solid #b7e4c7;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 15px;
        font-size: 13px;
      }

      .api-key-section label {
        font-weight: 600;
        color: #2d6a4f;
        display: block;
        margin-bottom: 6px;
      }

      .api-key-section input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
      }

      .api-key-section small {
        color: #888;
        display: block;
        margin-top: 5px;
      }

      .chat-box {
        max-height: 420px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #f9fdf9;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }

      .chat-bubble {
        max-width: 80%;
        padding: 10px 15px;
        margin: 8px 0;
        border-radius: 15px;
        font-size: 15px;
        line-height: 1.5;
        animation: fadeIn 0.3s ease-in-out;
      }

      .user-bubble {
        background-color: #d8f3dc;
        align-self: flex-end;
        text-align: right;
      }

      .bot-bubble {
        background-color: #e9e9e9;
        align-self: flex-start;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .typing {
        font-style: italic;
        color: #888;
      }

      .input-group input {
        height: 48px;
        font-size: 15px;
        border-radius: 8px;
      }

      .btn-send {
        height: 48px;
        border-radius: 8px;
        background-color: #2d6a4f;
        border-color: #2d6a4f;
      }

      .btn-send:hover {
        background-color: #1b4332;
        border-color: #1b4332;
      }

      .system-prompt-note {
        font-size: 11px;
        color: #aaa;
        text-align: center;
        margin-bottom: 8px;
      }
    </style>
  </head>

  <body>
    <div class="container chat-container">
      <div class="chat-header">
        <h3>🌾 CropSense AI ChatBot</h3>
        <p style="color:#666; font-size:14px;">Ask me anything about crops, farming, diseases, or soil.</p>
      </div>

      <!-- API Key Input (user provides their own key - not hardcoded) -->
      <div class="api-key-section">
        <label for="apiKeyInput">🔑 OpenRouter API Key</label>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Enter your OpenRouter API key (sk-or-v1-...)"
        />
        <small>
          Get a free key at
          <a href="https://openrouter.ai" target="_blank">openrouter.ai</a>.
          Your key is only used in your browser and never stored or sent to our server.
        </small>
      </div>

      <div class="system-prompt-note">
        Bot is specialized in agriculture topics: crops, soil, diseases, weather, and farming techniques.
      </div>

      <div id="chatBox" class="chat-box"></div>

      <div class="input-group">
        <input
          type="text"
          class="form-control"
          id="userInput"
          placeholder="Ask about crops, fertilizers, diseases..."
        />
        <div class="input-group-append">
          <button class="btn btn-primary btn-send" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById('chatBox');

      // Agriculture-focused system prompt
      const SYSTEM_PROMPT = `You are CropSense AI, an expert agricultural advisor. 
      You help farmers with crop recommendations, disease identification, soil management, 
      fertilizer advice, and general farming best practices. 
      Keep answers practical, concise, and farmer-friendly. 
      If a question is unrelated to agriculture, politely redirect to farming topics.`;

      function appendMessage(content, isUser = false) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${isUser ? 'user-bubble' : 'bot-bubble'}`;
        bubble.innerHTML = isUser ? content : marked.parse(content);
        chatBox.appendChild(bubble);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function showTyping() {
        const typing = document.createElement('div');
        typing.id = 'typing';
        typing.className = 'typing bot-bubble chat-bubble';
        typing.innerText = 'CropSense AI is thinking...';
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTyping() {
        const typing = document.getElementById('typing');
        if (typing) typing.remove();
      }

      async function sendMessage() {
        const input  = document.getElementById('userInput');
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const message = input.value.trim();

        if (!message) return;

        if (!apiKey) {
          alert('Please enter your OpenRouter API key above to use the chatbot.');
          return;
        }

        appendMessage(message, true);
        input.value = '';
        showTyping();

        try {
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: 'deepseek/deepseek-r1:free',
              messages: [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'user',   content: message },
              ],
            }),
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || `HTTP ${response.status}`);
          }

          const data = await response.json();
          removeTyping();
          const reply = data.choices?.[0]?.message?.content || 'No response received.';
          appendMessage(reply);

        } catch (error) {
          removeTyping();
          appendMessage(`<em style="color:red;">Error: ${error.message}. Please check your API key.</em>`);
        }
      }

      // Allow Enter key to send
      document.getElementById('userInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') sendMessage();
      });

      // Welcome message
      appendMessage('Hello! 🌱 I\'m CropSense AI. Ask me about crops, soil health, plant diseases, or fertilizers!');
    </script>
  </body>
</html>
